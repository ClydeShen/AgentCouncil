[project]
name = "agentcouncil"
version = "0.1.0"
description = "Universal multi-agent A2A hub with optional MCP bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=1.0",
    "fastmcp>=3.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
